name: Update aqua checksums

# aqua.yaml sets checksum.require_checksum, so a version bump that isn't
# accompanied by fresh hashes in aqua-checksums.json produces an overlay image
# that fails to build. Renovate bumps aqua.yaml but cannot compute the hashes,
# so this job does it on Renovate's own branch before the PR is merged.
#
# Same trust model as Renovate itself: the new hashes are taken from whatever
# upstream publishes at the pinned version at this moment. The pins stop a
# release from changing under us later; they are not a review of the new
# release.

on:
  pull_request:
    branches: [master]
    paths:
      - .vibepod/overlay/aqua.yaml
      - .vibepod/overlay/Dockerfile

jobs:
  update-checksums:
    # Only on Renovate's bumps; skips manual or fork PRs.
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.head_ref }}

      - name: Get last commit message
        # %s = subject line only; %B (full body) breaks $GITHUB_ENV on multi-line messages.
        run: echo "commit_message=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - name: Read pinned aqua version
        id: aqua
        # Reuse the Dockerfile's pin instead of a second copy here, so the
        # hashes are always generated by the aqua that will consume them.
        run: |
          version="$(sed -n 's/^ARG AQUA_VERSION=//p' .vibepod/overlay/Dockerfile)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e  # v4.0.5
        with:
          aqua_version: ${{ steps.aqua.outputs.version }}
          # No aqua.yaml at the repo root; this job only regenerates hashes.
          enable_aqua_install: false

      - name: Update aqua-checksums.json
        env:
          # Unauthenticated GitHub API calls get rate limited well before aqua
          # has resolved every package.
          AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --prune drops the entries of the version being replaced, which aqua
        # otherwise leaves behind.
        run: aqua -c .vibepod/overlay/aqua.yaml update-checksum -a --prune

      - name: Update aqua-installer checksum
        # AQUA_INSTALLER_SHA256 pins a file fetched by tag, not a release
        # asset, so Renovate cannot pair it with the version it just bumped.
        run: |
          cd .vibepod/overlay
          version="$(sed -n 's/^ARG AQUA_INSTALLER_VERSION=//p' Dockerfile)"
          test -n "${version}"
          sha="$(curl -sSfL "https://raw.githubusercontent.com/aquaproj/aqua-installer/${version}/aqua-installer" | sha256sum | cut -d' ' -f1)"
          sed -i "s|^ARG AQUA_INSTALLER_SHA256=.*|ARG AQUA_INSTALLER_SHA256=${sha}|" Dockerfile

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # v7.2.0
        if: ${{ env.commit_message != 'Apply automatic changes' }}

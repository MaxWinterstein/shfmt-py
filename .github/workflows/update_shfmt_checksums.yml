name: Update shfmt checksums

on:
  pull_request:
    branches: [master]
    paths: [setup.py]

jobs:
  update-checksums:
    # Only on Renovate's mvdan/sh bumps; skips manual or fork PRs.
    if: startsWith(github.head_ref, 'renovate/mvdan-sh')
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.PAT }}
          # Need history so the script can read setup.py at HEAD~1 to
          # detect SHFMT_VERSION changes and reset PY_VERSION on bumps.
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Get last commit message
        id: get_commit_message
        # %s = subject line only; %B (full body) breaks $GITHUB_ENV on multi-line messages.
        run: echo "commit_message=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run checksum update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/update_shfmt_checksums.py

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # v7.2.0
        if: ${{ env.commit_message != 'Apply automatic changes' }}
        with:
          # Renovate reads the author *and* the committer of every commit on
          # its branch, and stops rebasing the PR as soon as it sees an email
          # it doesn't know. The action would otherwise take the author from
          # github.actor and the committer from its own default, so pin both
          # to the one identity listed in renovate.json's gitIgnoredAuthors.
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

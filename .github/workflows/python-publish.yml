name: Build (and publish on release) Python Package

on:
  release:
    types: [published]
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux_x86_64
            host_platform: manylinux2014_x86_64
          - os: ubuntu-24.04-arm
            name: linux_aarch64
            host_platform: manylinux2014_aarch64
          - os: macos-latest
            name: macos_arm64
            host_platform: macosx-11.0-arm64
          - os: macos-15-intel
            name: macos_x86_64
            host_platform: macosx-10.9-x86_64
          - os: windows-latest
            name: windows_amd64
            host_platform: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # setuptools-scm derives the version from the latest git tag.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Point the README's pre-commit rev at this release
        # README.md is the PyPI long_description and carries the `rev:` users
        # copy. sync_readme_to_release.yml only rewrites it *after* the release
        # is published, so the tag these artifacts are built from still names
        # the previous release: 4.0.0 shipped `rev: v3.13.0.3` and 3.13.0.3
        # shipped `rev: v3.13.0.1`. Rewrite it in the build tree, never
        # committed, so each artifact advertises itself.
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/stamp-readme-rev.sh
      - run: python -m pip install build
      - name: Build wheel
        env:
          # Override the platform tag so the wheel is tagged for broad
          # compatibility (e.g. manylinux2014 instead of bare linux_*).
          # An empty value leaves the platform tag at setuptools' default.
          _PYTHON_HOST_PLATFORM: ${{ matrix.host_platform }}
        run: python -m build --wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: Point the README's pre-commit rev at this release
        # Same reasoning as in build-wheels above.
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/stamp-readme-rev.sh
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The jobs above only prove the artifacts *build*. Nothing so far installs
  # them or runs the binary they ship, so a wheel that is mistagged or missing
  # shfmt would go straight to PyPI. These two jobs gate `publish` on the
  # artifacts actually working, on the same platform they are tagged for.
  smoke-test-wheels:
    needs: [build-wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel-linux_x86_64
            expected_tag: py2.py3-none-manylinux2014_x86_64
          - os: ubuntu-24.04-arm
            artifact: wheel-linux_aarch64
            expected_tag: py2.py3-none-manylinux2014_aarch64
          - os: macos-latest
            artifact: wheel-macos_arm64
            expected_tag: py2.py3-none-macosx_11_0_arm64
          - os: macos-15-intel
            artifact: wheel-macos_x86_64
            expected_tag: py2.py3-none-macosx_10_9_x86_64
          - os: windows-latest
            artifact: wheel-windows_amd64
            expected_tag: py2.py3-none-win_amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Check the wheel tag
        # A pure-python `py3-none-any` tag installs everywhere and would only
        # be noticed once someone downloads it on the wrong platform, so pin
        # the expected tag rather than trusting pip's compatibility check.
        env:
          EXPECTED_TAG: ${{ matrix.expected_tag }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel, got ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          name=$(basename "${wheels[0]}")
          echo "wheel: $name"
          case "$name" in
            *-"$EXPECTED_TAG".whl) echo "tag matches $EXPECTED_TAG" ;;
            *) echo "::error::wheel tag mismatch: expected *-$EXPECTED_TAG.whl, got $name"; exit 1 ;;
          esac
      - name: Install the wheel
        # --no-index / --only-binary keeps pip from quietly rebuilding from
        # source: whatever runs below is the artifact we are about to publish.
        run: |
          python -m pip install --no-index --only-binary=:all: --find-links dist shfmt-py
      - name: Run the shfmt it ships
        run: |
          shfmt --version
          expected=$(python -c "import re, pathlib; print(re.search(r'SHFMT_VERSION = \"([^\"]+)\"', pathlib.Path('setup.py').read_text())[1])")
          actual=$(shfmt --version)
          if [ "$actual" != "v$expected" ]; then
            echo "::error::wheel ships shfmt $actual, but setup.py pins v$expected"
            exit 1
          fi
      - name: Format a real script with it
        run: |
          printf '#!/bin/sh\nif [ -n "$1" ]; then\necho "hello $1"\nfi\n' > messy.sh
          shfmt -w messy.sh
          cat messy.sh
          # -d exits non-zero if anything is still unformatted
          shfmt -d messy.sh

  smoke-test-sdist:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Validate the metadata PyPI will render
        run: |
          python -m pip install twine
          twine check dist/*
      - name: Check every artifact carries the release version
        # setuptools-scm derives the version from git state, so a dirty or
        # detached tree silently yields something like 4.0.1.dev0 instead of
        # 4.0.0 — and that is what would get published. Assert the filenames
        # against the tag rather than trusting the derivation.
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          shopt -s nullglob
          artifacts=(dist/*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "::error::no artifacts to check"
            exit 1
          fi
          for f in "${artifacts[@]}"; do
            name="$(basename "$f")"
            case "$name" in
              "shfmt_py-$expected-"*.whl | "shfmt_py-$expected.tar.gz")
                echo "ok: $name" ;;
              *)
                echo "::error::$name does not carry version $expected"
                exit 1 ;;
            esac
          done
      - name: Install from the sdist and run it
        # Naming the tarball explicitly makes pip build it from source, which
        # is the path a user without a matching wheel would hit.
        run: |
          python -m pip install dist/*.tar.gz
          shfmt --version

  publish:
    needs: [build-wheels, build-sdist, smoke-test-wheels, smoke-test-sdist]
    # Only actually publish on real release events; the build matrix above
    # still runs on every PR / push to catch wheel-build regressions early.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts to publish
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@e9ccbe5a211ba3e8363f472cae362b56b104e796
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

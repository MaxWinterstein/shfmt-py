name: Sync README rev to latest release

on:
  release:
    types: [published]

# The PR itself is opened with secrets.PAT (see below); the job token only
# needs to read the checkout.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master

      - name: Rewrite rev in README.md
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i -E "s|(rev:[[:space:]]+)v?[0-9]+(\.[0-9]+)+|\\1${TAG}|" README.md
          git --no-pager diff -- README.md

      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8  # v8.1.2
        with:
          # Not the default GITHUB_TOKEN: GitHub doesn't start workflows for
          # PRs it opens, so the required checks never reported and every
          # sync PR (#58, #76, #84, #92) needed an admin override to merge.
          # The PAT needs Contents and Pull requests write on this repo.
          token: ${{ secrets.PAT }}
          branch: sync-readme-to-release
          delete-branch: true
          title: "Sync README rev to ${{ github.event.release.tag_name }}"
          commit-message: "Sync README rev to ${{ github.event.release.tag_name }}"
          body: |
            Automated update of the pre-commit example in `README.md` after a new release.

            Triggered by release [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }}).

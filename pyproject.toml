[build-system]
requires = ["setuptools>=70.1", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "shfmt-py"
# This is the one line PyPI search results and `pip index` show, so it leads
# with what you get rather than how it is built. Deliberately does not say
# "wrapper around invoking shfmt" — there is nothing to import or call.
description = "Installs the shfmt shell script formatter binary, plus a ready-made pre-commit hook"
readme = "README.md"
# The authored code is MIT. Every wheel also contains upstream's shfmt
# binary, which is BSD-3-Clause, so the distribution as a whole is both —
# spelled out here so license scanners see the bundled terms, not just ours.
license = "MIT AND BSD-3-Clause"
# LICENSE-shfmt is upstream's BSD-3-Clause text. We redistribute the shfmt
# binary unmodified, and clause 2 requires that notice to travel with binary
# distributions — which every wheel here is. NOTICE holds the shellcheck-py
# attribution that used to sit under a rule at the bottom of LICENSE; it was
# split out so GitHub detects LICENSE as plain MIT instead of "Other".
license-files = ["LICENSE", "LICENSE-shfmt", "NOTICE"]
authors = [
    {name = "Max Winterstein", email = "github@winterstein.io"},
]
requires-python = ">=3.9"
# What someone actually types into PyPI search when looking for this.
keywords = ["shfmt", "shell", "bash", "formatter", "pre-commit", "pre-commit-hook"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # Every version allowed by requires-python. The distribution ships no
    # Python code at all, so support is bounded by the floor, not by what the
    # CI matrix happens to exercise.
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.optional-dependencies]
# setuptools is a build-time dep but not a runtime dep, so it isn't in the
# venv after `pip install`. Tests load setup.py (which imports setuptools)
# via importlib, so they need it explicitly. The floor is not optional here:
# setup.py imports setuptools.command.bdist_wheel unconditionally, which only
# exists from 70.1 on, matching the build-system requirement above.
test = ["pytest>=7", "setuptools>=70.1"]

[project.urls]
# These become the PyPI sidebar. With only Homepage there was no route from
# the project page to the issue tracker or to what a release actually bundles.
# No Source row on purpose — it would just repeat Homepage.
Homepage = "https://github.com/MaxWinterstein/shfmt-py"
Issues = "https://github.com/MaxWinterstein/shfmt-py/issues"
Changelog = "https://github.com/MaxWinterstein/shfmt-py/releases"
"Upstream (mvdan/sh)" = "https://github.com/mvdan/sh"

[tool.setuptools_scm]
# Strip any local version segment so PyPI accepts the version.
local_scheme = "no-local-version"

[tool.setuptools]
# No Python modules to package — this distribution ships only the shfmt
# binary, installed via the custom commands in setup.py.
py-modules = []

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# E/F = pycodestyle errors + pyflakes
# I   = import sorting (replaces reorder-python-imports)
# UP  = pyupgrade
# COM = trailing commas (replaces add-trailing-comma)
# B   = flake8-bugbear (catches common Python pitfalls)
select = ["E", "F", "I", "UP", "COM", "B"]
extend-ignore = ["COM812"]  # ruff format owns trailing commas
